<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#04060d;
    font-family:'Inter','DejaVu Sans',system-ui,sans-serif}
  #c{position:absolute;inset:0}
  #ui{position:absolute;left:7%;bottom:12%;z-index:9;display:flex;flex-direction:column;
    align-items:flex-start;text-align:left;pointer-events:none}
  .el{opacity:0;will-change:transform,opacity}
  #gbrand{font-size:110px;font-weight:200;color:#fff;letter-spacing:-0.03em;line-height:1;
    text-shadow:0 4px 60px rgba(0,0,0,.75)}
  #gtitle{font-size:38px;font-weight:400;color:rgba(255,255,255,0.62);margin-top:22px;max-width:1300px;line-height:1.15}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="gbrand" class="el">GAIA Prime</div>
  <div id="gtitle" class="el">—</div>
</div>
<img id="alfa" src="./alfa-solo.png" style="display:none">
<script>
const P=new URLSearchParams(location.search);
if(P.get('title'))document.getElementById('gtitle').textContent=P.get('title');
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=window.devicePixelRatio||1,W=1920,H=1080;
cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.scale(DPR,DPR);
const CX=W*0.5, CY=H*0.40;
// ---- nube 1s del hidrógeno: densidad exponencial (azules la-forja) ----
let _s=4242; const rnd=()=>{_s=(_s*1664525+1013904223)>>>0;return _s/4294967296;};
const N=3000, PTS=[];
for(let i=0;i<N;i++){
  const u=rnd();
  const r=(60 + (-Math.log(1-u*0.985))*95);          // falloff 1s
  const th=Math.acos(2*rnd()-1), ph=rnd()*6.283;
  PTS.push({
    x:r*Math.sin(th)*Math.cos(ph), y:r*Math.sin(th)*Math.sin(ph)*0.85, z:r*Math.cos(th),
    ph:rnd()*6.283, sp:0.5+rnd()*1.1, sz:0.9+rnd()*1.9, scat:2.2+rnd()*4.0,
    c:rnd()  // 0=cyan claro 1=azul profundo
  });
}
// ---- electrones con estela (órbitas elípticas 3D inclinadas) ----
const ELE=[
  {a:265,b:180,inc:0.45,w:1.9,ph:0.0},
  {a:300,b:150,inc:-0.7,w:-1.5,ph:2.1},
  {a:235,b:210,inc:1.15,w:2.3,ph:4.2},
];
const clamp=x=>Math.min(1,Math.max(0,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const seg=(t,a,b)=>ease((t-a)/(b-a));
function pcol(c,br){ // cyan #4FC3F7 -> azul #3b82f6
  const r=(79+(59-79)*c)*br, g=(195+(130-195)*c)*br, b=(247+(246-247)*c)*br;
  return `rgb(${r|0},${g|0},${b|0})`;
}
function glow(x,y,rad,rgba){const g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,rgba);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,6.283);ctx.fill();}
function proj(x,y,z){const p=560/(560+z);return [CX+x*p, CY+y*p, p];}
const IMG=document.getElementById('alfa');
// El PNG del α trae fondo casi-negro (no negro puro) → en blend aditivo se ve un
// cuadro gris. Se recorta por luminancia: oscuro→transparente, el oro queda.
const OFF=document.createElement('canvas'); let OFFREADY=false;
function prepAlfa(){
  if(OFFREADY||!IMG.complete||!IMG.naturalWidth)return;
  const s=IMG.naturalWidth; OFF.width=s; OFF.height=s;
  const c2=OFF.getContext('2d'); c2.drawImage(IMG,0,0);
  try{
    const d=c2.getImageData(0,0,s,s);
    for(let i=0;i<d.data.length;i+=4){
      const l=Math.max(d.data[i],d.data[i+1],d.data[i+2]);
      d.data[i+3]=l<36?0:Math.min(255,(l-36)*2.4);
    }
    c2.putImageData(d,0,0); OFFREADY=true;
  }catch(e){ OFFREADY=true; /* si canvas tainted, usa IMG directo */ }
}
window.render=function(t){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#04060d';ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const app=seg(t,0,0.7), form=seg(t,0,1.6);
  const rot=t*0.5, cr=Math.cos(rot), sr=Math.sin(rot);
  const wob=Math.sin(t*0.7)*0.12, cw=Math.cos(wob), sw=Math.sin(wob);
  // halo ambiente
  glow(CX,CY,520,'rgba(30,58,138,'+(0.20*app)+')');
  glow(CX,CY,300,'rgba(245,158,11,'+(0.10*app)+')');
  // proyectar partículas y separar por profundidad
  const far=[],near=[];
  for(let i=0;i<N;i++){const p=PTS[i];
    const sc=p.scat+(1-p.scat)*form;
    let x=p.x*sc,y=p.y*sc,z=p.z*sc;
    let rx=x*cr-z*sr, rz=x*sr+z*cr;                 // rot Y
    let ry=y*cw-rz*sw; rz=y*sw+rz*cw;               // wobble X
    const br=(0.45+0.55*Math.sin(t*p.sp+p.ph))*app;
    if(br<=0.03)continue;
    (rz>0?far:near).push([rx,ry,rz,p,br]);
  }
  const drawP=arr=>{for(const [rx,ry,rz,p,br] of arr){
    if(rz<=-500)continue;                                  // detrás de la cámara
    const [sx,sy,pp]=proj(rx,ry,rz);
    if(pp<=0.05)continue;
    ctx.fillStyle=pcol(p.c, br*(0.55+0.45*Math.min(pp,1.6)));
    ctx.beginPath();ctx.arc(sx,sy,Math.max(0.1,p.sz*pp),0,6.283);ctx.fill();
  }};
  drawP(far);
  // ---- α: el núcleo de la marca (aditivo: su fondo negro desaparece) ----
  const al=seg(t,0.9,1.8);
  if(al>0 && IMG.complete){
    prepAlfa();
    const pulse=1+0.03*Math.sin(t*2.6);
    const sz=460*(1.18-0.18*al)*pulse;
    glow(CX,CY,sz*0.85,'rgba(245,158,11,'+(0.35*al)+')');
    ctx.globalAlpha=al;
    ctx.drawImage(OFFREADY&&OFF.width?OFF:IMG, CX-sz/2, CY-sz/2, sz, sz);
    ctx.globalAlpha=1;
  }
  drawP(near);
  // ---- electrones con estela ----
  const ev=seg(t,1.5,2.3);
  if(ev>0){
    for(const e of ELE){
      const ci=Math.cos(e.inc), si=Math.sin(e.inc);
      const K=16;
      for(let k=K;k>=0;k--){
        const a=e.ph+t*e.w - k*0.055*Math.sign(e.w);
        let x=Math.cos(a)*e.a, y=Math.sin(a)*e.b*0.35, z=Math.sin(a)*e.b;
        let ry=y*ci - z*si, rz=y*si + z*ci;
        let rx=x*cr - rz*sr; rz=x*sr + rz*cr;
        if(rz<=-500)continue;
        const [sx,sy,pp]=proj(rx,ry,rz);
        if(pp<=0.05)continue;
        const aK=(1-k/K);
        if(k===0){ glow(sx,sy,14*pp,'rgba(255,255,255,'+(0.85*ev)+')'); ctx.fillStyle='rgba(220,245,255,'+(0.95*ev)+')'; ctx.beginPath();ctx.arc(sx,sy,3.2*pp,0,6.283);ctx.fill(); }
        else { ctx.fillStyle='rgba(103,232,249,'+(0.38*ev*aK*aK)+')'; ctx.beginPath();ctx.arc(sx,sy,2.2*pp*aK,0,6.283);ctx.fill(); }
      }
    }
  }
  // ---- texto ----
  const $=id=>document.getElementById(id);
  const b=seg(t,1.9,2.7); $('gbrand').style.opacity=b; $('gbrand').style.transform=`translateY(${(1-b)*16}px)`;
  const s=seg(t,2.3,3.1); $('gtitle').style.opacity=s; $('gtitle').style.transform=`translateY(${(1-s)*12}px)`;
  const fo=seg(t,3.7,4.0);
  document.getElementById('ui').style.opacity=1-fo; cv.style.opacity=1-0.9*fo;
};
window.render(0);
</script></body></html>
