server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Telemetry proxy — forja-only, vive en su misma red docker
    location /api/telemetry/ {
        proxy_pass http://gaia_telemetry_forja:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE necesita buffering off + larga conexión
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # Multi-page app: escuela.html, masterclass.html, economia.html, etc.
    # Para cada path, intenta archivo, luego directorio, luego index.html
    # DATOS PRECOMPUTADOS — la física ya calculada (nubes ab initio de los 118 átomos,
    # campos eléctricos, moléculas). Medido 2026-07-31: caían en `location /` y salían con
    # `no-cache, no-store`, así que CADA vista de un elemento bajaba 182 KB desde la casa
    # atravesando el túnel. La prueba de carga saturaba en 3.2 MB/s a 60 concurrentes, con
    # un átomo tardando 3.5 s. Son DERIVADOS INMUTABLES: un carbono resuelto no cambia.
    location /precomputed/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        gzip on;
        gzip_types application/octet-stream application/json;
        gzip_min_length 4096;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Audio MP3 — cache largo (no cambian de URL gracias al hash en el dist)
    location /audio/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Assets con hash en el filename — cache forever
    location ~* \.(js|css|woff2?|wasm|png|jpg|jpeg|svg|ico|bin)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # HTML entry points — no cache (siempre fresco)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
