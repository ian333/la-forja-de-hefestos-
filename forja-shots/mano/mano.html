  <text x="20" y="345" fill="#e06c6c" font-size="11">━ tendón a brazo r → τ_i = T·r_i · T = F·L/r</text>

  <text x="120" y="175" fill="#7ee081" font-size="11">tendón = puente LIBRE (gap ≥ SF·g_min+2δ, desliza)</text>

  <text x="40" y="215" fill="#6fb6c9" font-size="11.5">fan ALTO en el tendón → no suelda a la guía (Poisson a favor)</text>
