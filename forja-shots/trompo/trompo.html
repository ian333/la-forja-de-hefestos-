<body><h1>Trompo: dientes 3D — ¿axial y radial? + cualquier tamaño</h1>
<div class="sub">La curva 3D mete axial, PERO simétrica (barril) lo cancela → torque sigue tang×R (no se complica). Y escala a 100 g.</div>
<div class="grid">

  <text x="40" y="26" fill="#d8a657" font-size="14" font-weight="bold">la fuerza del contacto: ¿axial Y radial?</text>
  <text x="120" y="55" fill="#9fb3c8" font-size="12" text-anchor="middle">diente PLANO (ψ=0)</text>
  <line x1="120" y1="150" x2="120" y2="87.440944" stroke="#7ee081" stroke-width="3" marker-end="url(#ar)"/><text x="116" y="87.440944" fill="#7ee081" font-size="11" text-anchor="start">tang→torque</text>
  <line x1="120" y1="150" x2="143.941407" y2="150" stroke="#6fb6c9" stroke-width="3" marker-end="url(#ar)"/><text x="147.941407" y="150" fill="#6fb6c9" font-size="11" text-anchor="start">radial</text>
  <circle cx="120" cy="150" r="3" fill="#9fb3c8"/>
  <text x="120" y="250" fill="#e06c6c" font-size="11" text-anchor="middle">axial = 0 ✓</text>
  <text x="430" y="55" fill="#9fb3c8" font-size="12" text-anchor="middle">diente CURVO (ψ=18°)</text>
  <line x1="430" y1="150" x2="430" y2="87.440944" stroke="#7ee081" stroke-width="3" marker-end="url(#ar)"/><text x="426" y="87.440944" fill="#7ee081" font-size="11" text-anchor="start">tang→torque</text>
  <line x1="430" y1="150" x2="452.769635" y2="150" stroke="#6fb6c9" stroke-width="3" marker-end="url(#ar)"/><text x="456.769635" y="150" fill="#6fb6c9" font-size="11" text-anchor="start">radial</text>
  <line x1="430" y1="150" x2="452" y2="172" stroke="#b58cf0" stroke-width="3" marker-end="url(#ar)"/><text x="456" y="172" fill="#b58cf0" font-size="11" text-anchor="start">AXIAL</text>
  <circle cx="430" cy="150" r="3" fill="#9fb3c8"/>
  <text x="430" y="250" fill="#b58cf0" font-size="11" text-anchor="middle">axial = F·sin ψ ≈ 31 N (NUEVO)</text></svg></div>
<div class="card"><svg width="580" height="270" viewBox="0 0 580 270" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="context-stroke"/></marker></defs><rect width="580" height="270" fill="#0d1218"/>
  <text x="40" y="26" fill="#d8a657" font-size="14" font-weight="bold">la clave: barril SIMÉTRICO cancela el axial</text>
  <!-- barril simétrico: dos conos espejo (forma de X / barril) -->
  <path d="M110,105 L190,165 L110,225" fill="none" stroke="#d8a657" stroke-width="2"/>
  <path d="M190,105 L110,165 L190,225" fill="none" stroke="#d8a657" stroke-width="2"/>
  <line x1="150" y1="147" x2="150" y2="113" stroke="#b58cf0" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="150" y1="183" x2="150" y2="217" stroke="#b58cf0" stroke-width="3" marker-end="url(#ar)"/>
  <text x="150" y="251" fill="#7ee081" font-size="12" text-anchor="middle">↑+↓ = 0 NETO ✓</text>
  <text x="150" y="269" fill="#9fb3c8" font-size="11" text-anchor="middle">barril (trompo simétrico)</text>
  <!-- cono simple: un solo sentido -->
  <path d="M370,105 L450,165 L370,225" fill="none" stroke="#d8a657" stroke-width="2"/>
  <line x1="410" y1="165" x2="410" y2="109" stroke="#e06c6c" stroke-width="4" marker-end="url(#ar)"/>
  <text x="410" y="251" fill="#e06c6c" font-size="12" text-anchor="middle">empuje NETO ≠ 0</text>
  <text x="410" y="269" fill="#9fb3c8" font-size="11" text-anchor="middle">cono simple (lo evitas)</text></svg></div>

  <circle cx="242.5" cy="85.11500000000001" r="5" fill="#7ee081"/><text x="242.5" y="75.11500000000001" fill="#7ee081" font-size="11" text-anchor="middle">ψ=15° → 97%</text> <circle cx="415" cy="100.1" r="5" fill="#6fb6c9"/><text x="415" y="90.1" fill="#6fb6c9" font-size="11" text-anchor="middle">ψ=30° → 87%</text>
  <text x="530" y="248" fill="#9fb3c8" font-size="11" text-anchor="end">inclinación del diente ψ →</text>
  <text x="40" y="268" fill="#9fb3c8" font-size="11">retención = cos ψ: a 15° pierdes 3%, a 30° pierdes 13%. La transmisión NO se complica.</text></svg></div>
