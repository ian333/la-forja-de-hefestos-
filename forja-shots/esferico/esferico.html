<!doctype html><html><head><meta charset="utf8"><style>body{margin:0;background:#0d1218;font-family:system-ui;color:#9fb3c8}h1{color:#d8a657;text-align:center;padding:16px 0 4px;font-size:21px}.sub{text-align:center;font-size:13px;padding-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}.card{background:#121a22;border:1px solid #d8a65733;border-radius:10px;padding:8px}.wide{grid-column:1 / -1}</style></head>
<body><h1>Esférico vs Barril — la verdad honesta (bolas vs rodillos)</h1>
<div class="sub">El esférico (punto) concentra MÁS esfuerzo que el barril (línea). El barril carga más; la esfera centra en 2 ejes.</div>
<div class="grid">
<div class="card"><svg width="560" height="290" viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="290" fill="#0d1218"/>
  <text x="40" y="26" fill="#d8a657" font-size="14" font-weight="bold">balero de BOLAS (punto) vs RODILLOS (línea)</text>
  <text x="150" y="56" fill="#9fb3c8" font-size="12" text-anchor="middle">ESFERA — punto</text>
  <circle cx="150" cy="150" r="46" fill="none" stroke="#9fb3c8" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="9" fill="#e06c6c"/>
  <text x="150" y="220" fill="#e06c6c" font-size="11" text-anchor="middle">área 0.45 mm² · p 35 MPa</text>
  <text x="430" y="56" fill="#9fb3c8" font-size="12" text-anchor="middle">BARRIL — línea</text>
  <rect x="384" y="104" width="92" height="92" rx="6" fill="none" stroke="#9fb3c8" stroke-width="1.5"/>
  <rect x="426" y="110" width="8" height="80" rx="4" fill="#7ee081"/>
  <text x="430" y="220" fill="#7ee081" font-size="11" text-anchor="middle">área 1.48 mm² · p 9 MPa</text>
  <text x="40" y="270" fill="#6fb6c9" font-size="12">la LÍNEA reparte a lo largo del diente; el PUNTO concentra → el BARRIL carga más</text></svg></div>
<div class="card"><svg width="560" height="290" viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg"><rect width="560" height="290" fill="#0d1218"/>
  <text x="40" y="26" fill="#d8a657" font-size="14" font-weight="bold">el socket NO puede ser el negativo EXACTO</text>
  <circle cx="220" cy="160" r="40" fill="none" stroke="#d8a657" stroke-width="2"/>
  <path d="M176,160 A44 44 0 1 1 264,160" fill="none" stroke="#e06c6c" stroke-width="4"/>
  <text x="220" y="222" fill="#e06c6c" font-size="11" text-anchor="middle">exacto → TRABA ✗</text>
  <circle cx="380" cy="160" r="40" fill="none" stroke="#d8a657" stroke-width="2"/>
  <path d="M330,156 A50 50 0 1 1 430,156" fill="none" stroke="#7ee081" stroke-width="3" stroke-dasharray="2 3"/>
  <text x="380" y="222" fill="#7ee081" font-size="11" text-anchor="middle">socket + δ → GIRA ✓</text>
  <text x="40" y="250" fill="#9fb3c8" font-size="12">δ mín = gap(0.6) + fracción de órbita = 0.825 mm. El GAP DE ACEITE es lo que permite el giro.</text>
  <text x="40" y="270" fill="#6fb6c9" font-size="11">conformidad útil &lt; 1 (nunca el negativo exacto, o se traba)</text></svg></div>
<div class="card wide"><svg width="1130" height="270" viewBox="0 0 1130 270" xmlns="http://www.w3.org/2000/svg"><rect width="1130" height="270" fill="#0d1218"/>
  <text x="40" y="26" fill="#d8a657" font-size="14" font-weight="bold">la decisión (y el ganador: BARRIL esférico)</text>
  <text x="40" y="60" fill="#7ee081" font-size="13">BARRIL (línea):</text>
  <text x="60" y="80" fill="#9fb3c8" font-size="12">+ MÁS carga (reparte) · + menos esfuerzo · centra 1 eje (radial)</text>
  <text x="40" y="110" fill="#b58cf0" font-size="13">ESFERA (punto):</text>
  <text x="60" y="130" fill="#9fb3c8" font-size="12">− menos carga (concentra) · + centra 2 EJES · + tolera desalineación</text>
  <line x1="40" y1="150" x2="520" y2="150" stroke="#d8a65733"/>
  <text x="40" y="178" fill="#d8a657" font-size="13" font-weight="bold">★ BARRIL ESFÉRICO (rodillo abarrilado):</text>
  <text x="60" y="198" fill="#9fb3c8" font-size="12">contacto de LÍNEA (mucha carga) + corona que tolera desalineación.</text>
  <text x="60" y="216" fill="#7ee081" font-size="12">= lo mejor de ambos. Es lo que ya tienes (el barril simétrico).</text>
  <text x="40" y="250" fill="#6fb6c9" font-size="11">si priorizas CARGA → barril. Si priorizas CENTRADO 2D/desalineación → esfera (pagando carga).</text></svg></div>
</div></body></html>
