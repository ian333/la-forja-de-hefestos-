<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>GAIA · intro bumper</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: #E2E8F0;
    cursor: none;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* Subtle starfield-ish vignette */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(253,184,19,0.10) 0%, rgba(0,0,0,0) 55%),
      #000;
    animation: bgPulse 2.4s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.18); }
  }
  /* Slowly drifting particles — keeps the screen invalidating for headless capture */
  .stars {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 17% 23%, rgba(253,184,19,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 31% 67%, rgba(255,255,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 73% 41%, rgba(34,211,238,0.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 87% 78%, rgba(253,184,19,0.6), transparent 60%),
      radial-gradient(1px 1px at 52% 12%, rgba(255,255,255,0.4), transparent 60%),
      radial-gradient(1.2px 1.2px at 9% 88%, rgba(34,211,238,0.5), transparent 60%);
    animation: drift 3s linear infinite;
  }
  @keyframes drift {
    0% { transform: translateY(0); opacity: 0.7; }
    50% { opacity: 1; }
    100% { transform: translateY(-30px); opacity: 0.7; }
  }
  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.9' /></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.04; mix-blend-mode: overlay;
  }

  .stack {
    position: relative; z-index: 2; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 48px;
  }

  .gamma {
    font-family: 'Inter', serif;
    font-weight: 200;
    font-size: 320px;
    line-height: 1;
    letter-spacing: -0.04em;
    color: #FDB813;
    text-shadow:
      0 0 80px rgba(253,184,19,0.55),
      0 0 200px rgba(253,184,19,0.25);
    opacity: 0;
    transform: scale(0.6);
    animation: gammaIn 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .title-wrap {
    opacity: 0;
    transform: translateY(28px);
    animation: titleIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    max-width: 1800px;
  }
  .title {
    font-size: 84px;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: #FFFFFF;
    line-height: 1.05;
    text-shadow: 0 4px 28px rgba(0,0,0,0.6);
  }
  .tag {
    margin-top: 28px;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #FDB813;
    opacity: 0.85;
  }

  /* Bottom ticker */
  .ticker {
    position: absolute;
    bottom: 88px;
    left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 18px;
    color: rgba(226,232,240,0.45);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0;
    animation: tickIn 0.6s ease 2.0s forwards;
  }

  @keyframes gammaIn {
    0% { opacity: 0; transform: scale(0.6); filter: blur(20px); }
    60% { opacity: 1; transform: scale(1.04); filter: blur(0); }
    100% { opacity: 1; transform: scale(1.0); filter: blur(0); }
  }
  @keyframes titleIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes tickIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars"></div>
  <div class="grain"></div>
  <div class="stack">
    <div class="gamma">Γ</div>
    <div class="title-wrap">
      <div class="title" id="title">Masterclass</div>
      <div class="tag">GAIA · universidad ejecutable</div>
    </div>
  </div>
  <div class="ticker" id="ticker">— una sola idea, llevada hasta el final —</div>

  <script>
    (function() {
      const p = new URLSearchParams(window.location.search);
      const title = p.get('title');
      if (title) document.getElementById('title').textContent = title;
      const ticker = p.get('ticker');
      if (ticker) document.getElementById('ticker').textContent = ticker;
      // Signal to Playwright that bumper is ready
      window.__bumperReady = true;
    })();
  </script>
</body>
</html>
