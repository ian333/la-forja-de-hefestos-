<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0F17" />
  <meta name="description" content="GAIA — la universidad ejecutable. 3D-real, sin pizarrón aburrido. Carreras del IPN/UNAM, misiones de descubrimiento, software pro gratis para estudiantes." />
  <title>Γ GAIA — La universidad ejecutable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- FUENTES SIN BLOQUEAR EL PINTADO. Un <link rel="stylesheet"> a otro dominio DETIENE el
       primer pixel hasta resolver DNS + TLS + descargar de fonts.googleapis.com. Medido el
       2026-08-05: FCP 1708 ms, y la MEDIANA de sesión real es 0.9 s → el 87% de la gente se
       fue ANTES de que la página pintara. No rebotaban por lo que veían: por lo que NO veían.
       Con media="print" el navegador la baja sin bloquear y onload la activa. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>

  <!-- PRIMER PIXEL SIN JAVASCRIPT. El bundle trae three.js + r3f: para cuando baja, parsea y
       React monta ya pasaron ~1.7 s, y el 97.5% del tráfico llega desde un navegador DENTRO
       de Instagram/TikTok, donde la competencia es el feed que está a un swipe. Esto pinta
       con el HTML (que llega en 0.34 s) usando SOLO CSS embebido: cero peticiones, cero
       fuentes externas, cero imágenes.
       Vive DENTRO de #root, así que createRoot() lo sustituye al montar — no hay que
       borrarlo a mano ni se queda pegado si React tarda.
       Deliberadamente NO dice nada nuevo: repite el gancho del atrio para no interferir con
       la prueba A/B de héroes de EscuelaPortal. Es la MISMA página, antes; no otra página. -->
  <style>
    :root { color-scheme: dark }
    html,body { margin:0; background:#05060A; color:#E2E8F0 }
    /* La pila del sistema pinta AL INSTANTE; Inter entra después sin mover el layout. */
    #atrio-instantaneo{
      font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      min-height:100svh; display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; padding:0 24px; gap:22px;
      animation: atrio-entra .45s ease-out both;
    }
    @keyframes atrio-entra{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }
    #atrio-instantaneo .kicker{
      font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:#FDB813;
    }
    #atrio-instantaneo h1{
      margin:0; font-weight:800; letter-spacing:-.02em; line-height:.95;
      font-size:clamp(38px,11vw,88px);
    }
    #atrio-instantaneo .deg{
      background:linear-gradient(90deg,#4FC3F7,#7E57C2,#F472B6);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    #atrio-instantaneo p{ margin:0; max-width:34ch; color:#94A3B8; font-size:15px; line-height:1.6 }
    /* Latido: dice "esto está vivo y viene más" sin prometer nada falso. */
    #atrio-instantaneo .pulso{
      width:120px; height:2px; border-radius:2px; overflow:hidden; background:#1E293B;
    }
    #atrio-instantaneo .pulso i{
      display:block; width:40%; height:100%; border-radius:2px;
      background:linear-gradient(90deg,#4FC3F7,#F472B6);
      animation: pulso 1.1s ease-in-out infinite;
    }
    @keyframes pulso{ 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
    @media (prefers-reduced-motion: reduce){
      #atrio-instantaneo, #atrio-instantaneo .pulso i { animation:none }
    }
  </style>
</head>
<body class="bg-[#05060A] text-[#E2E8F0]">
  <div id="root"><div id="atrio-instantaneo">
    <div class="kicker">La escuela que querías cuando ibas a clase</div>
    <h1><span style="color:#fff">Cinco pilares.</span><br><span class="deg">Una clase de verdad.</span></h1>
    <p>Simuladores en 3D real con física de verdad. La intuición primero, las ecuaciones después.</p>
    <div class="pulso"><i></i></div>
  </div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
