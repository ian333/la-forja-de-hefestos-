  <!-- FUENTES SIN BLOQUEAR EL PINTADO. Un <link rel="stylesheet"> a otro dominio DETIENE el
       primer pixel hasta resolver DNS + TLS + descargar de fonts.googleapis.com. Medido el
       2026-08-05: FCP 1708 ms, y la MEDIANA de sesión real es 0.9 s → el 87% de la gente se

  <!-- ══ EL ATRIO: TRES REELS Y LUEGO LAS PUERTAS ═════════════════════════════════════
       Por qué (2026-08-10). El 96.5 % del tráfico llega DENTRO del navegador de Instagram,
       en móvil, con una MEDIANA DE SESIÓN DE 0.9 s y 1.91 % de c1. A los 0.9 s nadie ha
       leído nada: eso no es una decisión, es un REFLEJO — el mismo con el que se pasa un
       reel. La portada anterior decía "Cinco pilares. Una clase de verdad." a alguien que
       acababa de ver una molécula naciendo: la promesa y la entrega no se tocaban.

       Ian: "vienen de ver reels, démosles reels — pero serán el INTRO: ven tres, toman una
       de 2-3 opciones y llegan al producto. Es aprovechar la inercia que traen."

       No es una plataforma de reels: es un EMBUDO DE INERCIA. Un feed no termina nunca; el
       atrio sí — y la bifurcación cae DESPUÉS del tercero, cuando ya hay una persona atenta
       en vez de un pulgar. Y las puertas no son un menú de producto: cuál tocas dice quién
       eres, que es el filtro POR USO del que vive la escuela gratis.

       CÓMO PINTA EN MILISEGUNDOS:
       · el primer cuadro es una imagen INCRUSTADA en base64 (13.8 KB) — cero peticiones,
         cero DNS, cero ida y vuelta: pinta con el propio HTML, que llega en 0.34 s.
       · esa imagen es EXACTAMENTE el primer cuadro del video, así que cuando el video entra
         no se ve ningún salto: la imagen COBRA VIDA.
       · el video es un derivado de 540×960 con faststart (~1.5 MB, contra 170 MB del master
         4K); empieza a reproducir sin haber bajado todo.
       · todo esto es JS plano: NO espera al bundle de React (three.js + r3f tardan ~1.7 s).
       Vive dentro de #root, así que createRoot() lo sustituye si el usuario sigue de largo. -->
  <style>
    /* z-index ALTO: #root va antes en el DOM pero la app trae sus propias capas posicionadas
       y se pintaba ENCIMA del reel (medido en captura: el header de la escuela sobre el video). */
    #atrio{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#05060A;
           font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #atrio .capa{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #atrio #ap{filter:blur(6px);transform:scale(1.06)}   /* el poster es chico: el desenfoque esconde el reescalado */
    #atrio video{opacity:0;transition:opacity .25s ease}
    #atrio video.on{opacity:1}
    #atrio .sombra{position:absolute;inset:0;background:
      linear-gradient(180deg,rgba(5,6,10,.72) 0%,rgba(5,6,10,0) 26%,rgba(5,6,10,0) 52%,rgba(5,6,10,.92) 100%)}
    #atrio .barras{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:6px}
    #atrio .barras i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22)}
    #atrio .barras i b{display:block;height:100%;width:0;border-radius:3px;background:#fff}
    #atrio .pie{position:absolute;left:0;right:0;bottom:0;padding:26px 24px calc(30px + env(safe-area-inset-bottom));
                text-align:center;color:#E2E8F0}
    #atrio .tit{font-size:clamp(21px,6.2vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0 0 6px}
    #atrio .sub{margin:0;font-size:13px;color:#94A3B8}
    #atrio .puertas{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
                    gap:12px;padding:0 22px;background:rgba(5,6,10,.9);backdrop-filter:blur(8px)}
    #atrio .puertas.on{display:flex;animation:sube .32s ease-out both}
    @keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    #atrio .puertas h2{margin:0 0 10px;text-align:center;font-size:clamp(19px,5.4vw,26px);font-weight:800;
                       letter-spacing:-.02em;color:#fff}
    #atrio .puerta{display:block;padding:16px 18px;border-radius:14px;text-decoration:none;
                   border:1px solid rgba(148,163,184,.26);background:rgba(148,163,184,.07);color:#E2E8F0}
    #atrio .puerta b{display:block;font-size:16px;font-weight:700;color:#fff;margin-bottom:3px}
    #atrio .puerta span{font-size:13px;color:#94A3B8}
    #atrio .saltar{position:absolute;top:12px;right:14px;z-index:3;background:none;border:0;
                   color:rgba(226,232,240,.55);font-size:12px;padding:8px}
    @media (prefers-reduced-motion:reduce){#atrio .puertas.on{animation:none}}
  </style>

        at=document.getElementById('at'), as=document.getElementById('as'),
        pu=document.getElementById('apu'), bars=document.querySelectorAll('#atrio .barras b'),
        i=0, t0=Date.now();
    /* La telemetría del atrio ES el A/B: qué trío se mostró, hasta dónde llegaron y qué
       puerta tocaron. Con 17 reels ya subidos y sólo 3 en pantalla, las variantes salen
       gratis — no hay que construir un experimento, hay que registrar cuál tocó. */
    function ev(tipo, data){
      try{ navigator.sendBeacon('/api/telemetry/events', new Blob([JSON.stringify(
        [{type:tipo, t:Date.now(), url:location.href, data:data}])],{type:'application/json'})); }catch(e){}
    }
    function pinta(n){
      var r=REELS[n]; at.textContent=r.t; as.textContent=r.s;
      v.classList.remove('on'); v.src='/atrio/'+r.id+'.mp4'; v.play().catch(function(){});
      if(REELS[n+1]) { var pre=new Image(); pre.src='/atrio/'+REELS[n+1].id+'.jpg'; }
      ev('atrio.reel',{i:n, id:r.id});
    }
    v.addEventListener('playing', function(){ v.classList.add('on'); ap.style.opacity=0; });
    v.addEventListener('timeupdate', function(){
      if(v.duration) bars[i].style.width=(100*v.currentTime/v.duration)+'%';
    });
    v.addEventListener('ended', function(){
      bars[i].style.width='100%';
      if(i < REELS.length-1){ i++; pinta(i); } else { puertas('completo'); }
    });
    function puertas(motivo){
      pu.classList.add('on');
      ev('atrio.puertas',{motivo:motivo, vistos:i+1, seg:Math.round((Date.now()-t0)/1000),
                          trio:REELS.map(function(r){return r.id;}).join(',')});
    }
    document.getElementById('asaltar').onclick=function(){ v.pause(); puertas('saltar'); };
    /* CERRAR el atrio revela la app que React ya montó DEBAJO. Antes el atrio vivía dentro de
       #root y createRoot() lo BORRABA al montar (~1.7 s): la persona veía el reel y de pronto
       se le desaparecía. Como capa aparte, el reel manda hasta que el usuario decide. */
    window.cerrarAtrio=function(){ var a=document.getElementById('atrio'); if(a) a.remove(); };
    /* tocar avanza al siguiente: es el gesto que ya traen del feed */
    document.getElementById('atrio').addEventListener('click', function(e){
      if(e.target.closest('.puerta')||e.target.closest('.saltar')||pu.classList.contains('on')) return;
      if(i < REELS.length-1){ bars[i].style.width='100%'; i++; pinta(i); } else { puertas('toque'); }
    });
    Array.prototype.forEach.call(document.querySelectorAll('#atrio .puerta'), function(a){
      a.addEventListener('click', function(){ ev('atrio.puerta',{p:a.dataset.p}); });
    });
    pinta(0);
  })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
